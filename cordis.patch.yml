# dsh-web-shell bundle patch: mounts the host PTY bridge. The same package
# declares `dsh.client`, so the client-modules scanner serves its browser half
# from this single row.
- insert:
    - id: web-shell
      name: 'dsh-web-shell'
      inject: [webServer, subprocess, webRuntime]
      config:
        shells: [bash, zsh]
        defaultShell: bash
        rows: 40
        cols: 120
        graceMs: 5000
        fontFamily: '"Maple Mono NF CN", "Sarasa Mono SC", "Cascadia Code", "JetBrains Mono", "Noto Sans Mono CJK SC", "Microsoft YaHei UI", monospace'
